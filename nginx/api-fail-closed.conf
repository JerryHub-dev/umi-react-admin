# /api 失败闭合契约（单一来源）。
#
# 由 nginx/default.conf 的 `location ~ ^/api(/|$)` include；三条产线必须给出同一份语义：
# 静态托管没有后端时返回 404 + JSON，绝不把 SPA 的 index.html 当成接口响应
# （审查 F6：Vercel 的 catch-all rewrite 曾经就是这个失败模式）。
# 对应用户侧实现：
#   - vercel.json 的 /api 规则 + api/[...path].js（503/404 JSON）
#   - scripts/serve-dist.mjs 的 /api 守卫
# 三者的比对回归见 scripts/deploy-routing.test.ts。
default_type application/json;
return 404 '{"error":"not_found","message":"static host has no API backend"}';
