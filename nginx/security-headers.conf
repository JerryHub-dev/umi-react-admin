# 安全响应头：由 default.conf 的每个 location include。
# nginx 中一旦 location 块自己写了 add_header，就不再继承 server 级的 add_header，
# 所以不能只在 server 块写一次。always：错误响应也带上。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

# CSP 默认强制执行。来源清单与 vercel.json / config.github.ts 保持一致：
# - 'unsafe-eval'：Cesium Knockout 模板编译用 new Function（实测在用），pdfjs 已关 isEvalSupported
# - style 'unsafe-inline'：AntD cssinjs 运行时注入 + tailwind 任意值
# - 高德脚本只放行 https://webapi.amap.com（@pansy/amap-api-loader 0.4.10 实际注入的主机：
#   es/utils.js 的 JSONP + es/index.js 的 AMapUI/Loca）；img/connect 仍保留 *.amap.com / *.autonavi.com
#   供瓦片与数据服务使用。加载器升级需重新推导，见 scripts/csp-amap-pinning.test.ts
# - openstreetmap：OpenLayers/Cesium HTTPS OSM 瓦片；basemaps.cartocdn.com：Cesium 探针通过后升级的暗色底图；
#   *.autonavi.com 同时是 Cesium OSM 不可达时的兜底瓦片；ion.cesium.com：显式配置 token 的影像
# - virtualearth.net：显式配置 ion token 的 Cesium 影像可能引用 Bing（元数据 + 瓦片）；
#   无 token 时不涉及（链路：「夜航滤镜」OSM → carto 升级 → 高德兜底）。
# - huoshanstatic：xgplayer 演示视频（media-src）；media blob:：wavesurfer 音频
# 模板拒绝未完成同意、遮罩与 CSP 集成的 Clarity 配置，不自动放行统计域。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-eval' https://webapi.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://ion.cesium.com https://api.cesium.com https://assets.ion.cesium.com https://*.virtualearth.net; connect-src 'self' blob: https://*.amap.com https://*.autonavi.com https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://ion.cesium.com https://api.cesium.com https://assets.ion.cesium.com https://*.virtualearth.net; font-src 'self' data:; media-src 'self' blob: https://sf1-cdn-tos.huoshanstatic.com; worker-src 'self' blob:; frame-src 'self'" always;

# 浏览器只在 HTTPS 响应上接受 HSTS；生产 TLS 由上游 ingress/LB 终止。
# 不包含 includeSubDomains，避免改变部署者其他子域的策略。
add_header Strict-Transport-Security "max-age=31536000" always;
