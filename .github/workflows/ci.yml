name: CI

# PR 时执行质量门禁（也可在 Actions 页手动触发）；master 的部署由 deploy.yml 负责。
# 不监听分支 push：同分支 push 与 PR 会双触发，被并发取消的那次会以 cancelled 留在 PR 检查列表里
on:
  pull_request:
  workflow_dispatch:

# 同一 PR 的新提交取消仍在运行的旧运行。
# group 用 PR 编号而非 head_ref（分支名）：外部 fork 可故意用与目标分支同名的分支开 PR，
# 与仓库分支共享 group 互相取消对方的运行（审计 2026-09-22 L-6，CI 可用性 DoS 面）
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# 最小权限（审计 2026-09-22 M-4）：PR 检查只需读取仓库内容，不依赖仓库默认的宽松 token 权限
permissions:
  contents: read

# 注：actions 按 commit SHA 钉固（注释保留版本号）；升级由 dependabot 提 PR（.github/dependabot.yml）
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm（读 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates（typecheck + 严格 lint + vitest，含演示数据合理性与 CSP 一致性）
        run: pnpm check

      - name: Dependency audit（全量公告、真实源码补丁和攻击回归；不忽略公告）
        run: pnpm audit:security

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 两条产线都冒烟：主产线（Vercel/Docker）与 GitHub Pages 子路径产线
        script: ['build:demo', 'build:github:demo']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm（读 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build smoke（${{ matrix.script }}，无需任何 secrets）
        run: pnpm run ${{ matrix.script }}

      - name: 体积预算与样式覆盖门禁
        if: matrix.script == 'build:demo'
        run: node scripts/check-bundle-size.mjs

      - name: 产物 JWT 泄露扫描
        # 补审计 security-6 的盲区：曾发生 token 经 define 注入构建产物并部署到 gh-pages。
        # CI 构建不注入 secret，产物里除 Cesium 自带的公开默认 token 外出现任何 JWT 都判失败
        run: node scripts/check-dist-secrets.mjs

      - name: define 注入路径的可检测性校验（闭环 Vercel 同类盲区）
        # 运行时构造一个公开的假 JWT（仓库卫生门禁禁止任何 JWT 形态字面量入库）注入构建：
        # 未声明时扫描必须失败（证明「注入→产物→检出」链路受门禁约束），经 EXPECTED_TOKEN 声明后必须通过
        if: matrix.script == 'build:demo'
        run: |
          DUMMY="$(printf '%s' '{"alg":"HS256"}' | base64 | tr '/+' '_-' | tr -d =).$(printf '%s' '{"purpose":"dist-secret-scan-gate"}' | base64 | tr '/+' '_-' | tr -d =).gate-check-signature"
          CESIUM_ION_TOKEN="$DUMMY" pnpm run build:demo
          if node scripts/check-dist-secrets.mjs; then
            echo "::error::注入的公开演示 JWT 未被产物扫描检出（扫描门禁存在盲区）"
            exit 1
          fi
          EXPECTED_TOKEN="$DUMMY" node scripts/check-dist-secrets.mjs

  e2e:
    # 浏览器级冒烟：GitHub Pages 同构的静态产物（子路径 + 404 回退 + meta CSP）逐路由打开，
    # 断言无未捕获异常、无 console.error、无 CSP 违规；另验证英文界面无遗漏中文与关键业务流程
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm（读 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build（GitHub Pages 产线）
        run: pnpm run build:github:demo

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm e2e

      - name: 上传 Playwright 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-pr
          path: playwright-report/
          retention-days: 7
